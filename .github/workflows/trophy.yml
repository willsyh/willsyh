name: Generate trophy card

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: generate trophy.svg
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: username=${{ github.repository_owner }}&theme=dracula&row=1&margin-w=8&margin-h=8&no-bg=false&no-frame=false
          path: dist/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: push trophy.svg to the output branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin trophy-output || true

          if git show-ref --verify --quiet refs/remotes/origin/trophy-output; then
            git worktree add publish origin/trophy-output
          else
            git worktree add --detach publish
            git -C publish switch --orphan trophy-output
          fi

          cp dist/trophy.svg publish/trophy.svg
          git -C publish add trophy.svg

          if git -C publish diff --cached --quiet; then
            echo "trophy.svg is already up to date"
            exit 0
          fi

          git -C publish commit -m "Update trophy.svg"
          git -C publish push origin HEAD:trophy-output
